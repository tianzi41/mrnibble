<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知伴 · 本地 AI 学习伴侣</title>
<link rel="stylesheet" href="/static/vendor/highlight/github.min.css">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<!-- 首屏防闪：在样式加载前就把 data-theme 设好（完整逻辑见 js/theme.js） -->
<script>
(function () {
  try {
    var v = localStorage.getItem("zhiban-theme") || "auto";
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var t = v === "auto" ? (dark ? "dark" : "") : v;
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<!-- 首屏防语言闪烁：在样式加载前就把 lang 设好（完整逻辑见 js/i18n.js）。
     默认 zh，与现有中文界面 / 测试零影响；选过 en 才变。 -->
<script>
(function () {
  try {
    var v = localStorage.getItem("zhiban-lang") === "en" ? "en" : "zh";
    document.documentElement.setAttribute("lang", v);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">
  <!-- ── 顶栏 ─────────────────────────────── -->
  <header class="topbar">
    <div class="brand"><span class="logo">知</span><span>知伴</span><small id="brand-sub">本地 AI 学习伴侣</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="topbar-right">
      <select id="theme-sel" class="theme-sel" title="外观（浅色 / 护眼 / 暗色）"></select>
      <select id="lang-sel" class="theme-sel" title="语言"></select>
      <span id="conn-dot" class="dot" title="服务状态"></span>
      <span id="model-badge" class="badge">未配置模型</span>
    </div>
  </header>

  <main id="view"></main>

  <!-- ── 全局提示 ─────────────────────────── -->
  <div id="toast" class="toast"></div>
</div>

<!-- 依赖顺序不可变：d3 → katex → markmap-view → markmap-lib -->
<!-- pdf.js：ESM 版本，用动态 import 把入口挂到 window，供后续原生脚本使用。
     用动态 import（而不是 type="module"）是为了能捕获加载失败并提示，
     否则模块加载失败会静默无感，只能看到「材料页渲染不出来」。 -->
<script>
(function () {
  import("/static/vendor/pdfjs/pdf.min.mjs").then(function (pdfjs) {
    pdfjs.GlobalWorkerOptions.workerSrc = "/static/vendor/pdfjs/pdf.worker.min.mjs";
    window.PdfJS = pdfjs;
  }).catch(function (e) {
    window.PdfJSError = String((e && e.message) || e);
    console.warn("pdf.js 加载失败：", window.PdfJSError);
  });
})();
</script>
